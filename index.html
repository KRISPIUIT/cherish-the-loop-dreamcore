<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dreamlit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f8eaff;font:14px 'Courier New',monospace;display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}h1{margin:0 0 4px;letter-spacing:5px;text-shadow:0 0 14px #ff5db5}.sub{color:#c9b8d8;font-size:12px;margin-bottom:10px}#wrap{position:relative;width:min(94vw,760px);height:500px;border:3px solid #ff9ed8;border-radius:10px;box-shadow:0 0 25px #ff5db566;overflow:hidden}canvas{display:block;width:100%;height:100%;background:#111821}#scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 50%,#0004 50%);background-size:100% 4px}#hud{width:min(94vw,760px);display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;margin-top:10px;font-weight:bold}.bar{display:inline-block;width:170px;height:15px;border:2px solid #ff9ed8;background:#000;vertical-align:middle}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ff9ed8,#ff5db5)}#controls{color:#c9b8d8;font-size:12px;margin-top:8px;text-align:center}button{display:none;margin-top:10px;padding:8px 16px;background:transparent;border:2px solid #ff9ed8;color:#f8eaff;font:700 14px 'Courier New';cursor:pointer}
</style></head><body>
<h1>DREAMLIT</h1><div class="sub">SUPER ILLIT • EL SUEÑO ABANDONADO</div>
<div id="wrap"><canvas id="game" width="760" height="500"></canvas><div id="scan"></div></div>
<div id="hud"><span>CORDURA: <i class="bar"><i id="sanity" class="fill"></i></i></span><span id="items">MATERIALES: 0</span><span id="status">Despiertas en el suelo...</span></div>
<button id="restart">REINICIAR</button><div id="controls">Moverse: <b>WASD / Flechas</b> · Interactuar: <b>E</b> · Pulso de luz: <b>Espacio</b></div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),W=c.width,H=c.height,ui={s:document.querySelector('#sanity'),i:document.querySelector('#items'),t:document.querySelector('#status'),r:document.querySelector('#restart')};
let keys={},state='intro',pulse=0,items=0;
const p={x:65,y:440,r:11,sanity:100,inv:[]},monster={x:650,y:80,r:27,speed:1.2},door={x:700,y:410,w:35,h:55};
const walls=[{x:90,y:60,w:18,h:190},{x:220,y:110,w:180,h:18},{x:355,y:50,w:18,h:190},{x:145,y:275,w:190,h:18},{x:445,y:145,w:18,h:180},{x:520,y:105,w:160,h:18},{x:600,y:300,w:18,h:115},{x:340,y:420,w:220,h:18},{x:80,y:430,w:170,h:18}];
const safe=[{x:135,y:80,r:50},{x:300,y:215,r:58},{x:510,y:330,r:55},{x:180,y:380,r:48}];
const things=[
{x:115,y:160,n:'llave',got:false},{x:270,y:65,n:'cinta de vídeo',got:false},{x:525,y:75,n:'batería',got:false},{x:575,y:365,n:'tarjeta',got:false},{x:200,y:325,n:'linterna',got:false}
];
const girls=[
{x:120,y:225,n:'YUNAH',saved:false,need:'llave',hint:'YUNAH: La llave está en el pasillo viejo. Busca los materiales.'},
{x:555,y:180,n:'MINJU',saved:false,need:'cinta de vídeo',hint:'MINJU: Ayúdame a despertar... reproduce mi cinta en la sala de control.'},
{x:305,y:85,n:'MOKA',saved:false,need:'batería',hint:'MOKA: Encontré poco... solo puedo darte esta pista: necesito una batería.'},
{x:470,y:380,n:'WONHEE',saved:false,need:'tarjeta',hint:'WONHEE: Tengo materiales para ti. Te daré una tarjeta y una linterna.'},
{x:665,y:245,n:'IROHA',saved:false,need:'linterna',hint:'IROHA: No puedo ver la salida. Ayúdame con la linterna.'}
];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function d(a,b,c,d){return Math.hypot(a-c,b-d)}function hitWall(a,b,r){return walls.some(w=>d(clamp(a,w.x,w.x+w.w),clamp(b,w.y,w.y+w.h),a,b)<r+2)}function msg(t){ui.t.textContent=t}
function reset(){state='intro';p.x=65;p.y=440;p.sanity=100;p.inv=[];items=0;monster.x=650;monster.y=80;monster.speed=1.2;things.forEach(z=>z.got=false);girls.forEach(z=>z.saved=false);ui.s.style.width='100%';ui.i.textContent='MATERIALES: 0';msg('Despiertas en el suelo...');ui.r.style.display='none'}
function begin(){if(state==='intro'){state='play';msg('Eres trabajador de demolición. Encuentra a YUNAH.')}}
function move(){let a=0,b=0;if(keys.ArrowUp||keys.KeyW)b--;if(keys.ArrowDown||keys.KeyS)b++;if(keys.ArrowLeft||keys.KeyA)a--;if(keys.ArrowRight||keys.KeyD)a++;if(a||b){let l=Math.hypot(a,b),nx=clamp(p.x+a/l*2.8,p.r,W-p.r),ny=clamp(p.y+b/l*2.8,p.r,H-p.r);if(!hitWall(nx,p.y,p.r))p.x=nx;if(!hitWall(p.x,ny,p.r))p.y=ny}}
function collect(){things.forEach(z=>{if(!z.got&&d(p.x,p.y,z.x,z.y)<25){z.got=true;p.inv.push(z.n);items++;ui.i.textContent='MATERIALES: '+items;msg('Recoges '+z.n)}})}
function interact(){girls.forEach(g=>{if(g.saved||d(p.x,p.y,g.x,g.y)>32)return;if(g.n==='MINJU'&&p.inv.includes('cinta de vídeo')){g.saved=true;msg('MINJU despierta: '+g.hint)}else if(p.inv.includes(g.need)){g.saved=true;msg(g.hint)}else msg(g.n+': todavía necesito '+g.need)});if(keys.KeyE&&girls[1].saved&&d(p.x,p.y,300,215)<55)msg('La cinta reproduce una voz: MINJU ha despertado.')}
function enemy(){let dx=p.x-monster.x,dy=p.y-monster.y,q=Math.hypot(dx,dy)||1;if(q<270){monster.speed=1.85;monster.x+=dx/q*monster.speed;monster.y+=dy/q*monster.speed}else{monster.speed=1.2;monster.x+=Math.sin(Date.now()/800)*.3;monster.y+=Math.cos(Date.now()/900)*.3}monster.x=clamp(monster.x,monster.r,W-monster.r);monster.y=clamp(monster.y,monster.r,H-monster.r)}
function update(){if(state!=='play')return;move();collect();if(keys.KeyE)interact();if(keys.Space&&!pulse){pulse=1}if(pulse){pulse+=5;let dx=monster.x-p.x,dy=monster.y-p.y,q=Math.hypot(dx,dy)||1;if(q<pulse+monster.r){monster.x+=dx/q*65;monster.y+=dy/q*65}if(pulse>85)pulse=0}enemy();let safeNow=safe.some(z=>d(p.x,p.y,z.x,z.y)<z.r),near=d(p.x,p.y,monster.x,monster.y)<95;if(near&&!safeNow)p.sanity-=.4;if(safeNow)p.sanity+=.2;p.sanity=clamp(p.sanity,0,100);ui.s.style.width=p.sanity+'%';if(p.sanity<=0||d(p.x,p.y,monster.x,monster.y)<38){state='lose';msg('El animal te encontró');ui.r.style.display='inline-block'}let all=girls.every(g=>g.saved);if(all&&d(p.x,p.y,door.x+18,door.y+25)<35){state='win';msg('¡Tú y las miembros escaparon!');ui.r.style.display='inline-block'}}
function draw(){x.fillStyle='#111821';x.fillRect(0,0,W,H);x.strokeStyle='#1d2a35';for(let a=0;a<W;a+=30){x.beginPath();x.moveTo(a,0);x.lineTo(a,H);x.stroke()}for(let b=0;b<H;b+=30){x.beginPath();x.moveTo(0,b);x.lineTo(W,b);x.stroke()}safe.forEach(z=>{x.fillStyle='#9fffe022';x.beginPath();x.arc(z.x,z.y,z.r,0,7);x.fill();x.strokeStyle='#9fffe0';x.stroke()});walls.forEach(w=>{x.fillStyle='#302c40';x.fillRect(w.x,w.y,w.w,w.h);x.strokeStyle='#ff9ed8';x.strokeRect(w.x,w.y,w.w,w.h)});things.forEach(z=>{if(!z.got){x.fillStyle='#ffe899';x.fillRect(z.x-6,z.y-6,12,12)}});girls.forEach(g=>{if(!g.saved){x.fillStyle=g.n==='IROHA'?'#ff83bd':'#ddd2ff';x.beginPath();x.arc(g.x,g.y,11+Math.sin(Date.now()/180+g.x)*2,0,7);x.fill();x.fillStyle='#fff';x.font='9px Courier New';x.textAlign='center';x.fillText(g.n,g.x,g.y+21)}});x.fillStyle=girls.every(g=>g.saved)?'#9fffe0':'#382941';x.fillRect(door.x,door.y,door.w,door.h);x.strokeStyle='#ff9ed8';x.strokeRect(door.x,door.y,door.w,door.h);x.fillStyle='#fff';x.font='9px Courier New';x.fillText('SALIDA',door.x+18,door.y+30);if(pulse){x.strokeStyle='#ff9ed8';x.lineWidth=3;x.beginPath();x.arc(p.x,p.y,pulse,0,7);x.stroke()}x.fillStyle='#fff';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.save();x.shadowBlur=20;x.shadowColor='#ff4f9e';x.fillStyle='#ed397e';x.beginPath();x.arc(monster.x,monster.y,monster.r+Math.sin(Date.now()/150)*3,0,7);x.fill();x.restore();x.fillStyle='#17121d';x.beginPath();x.arc(monster.x-9,monster.y-4,4,0,7);x.arc(monster.x+9,monster.y-4,4,0,7);x.fill();x.fillStyle='#25203a';x.beginPath();x.arc(monster.x,monster.y-27,18,Math.PI,0);x.fill();x.beginPath();x.moveTo(monster.x-14,monster.y-28);x.lineTo(monster.x-19,monster.y-49);x.lineTo(monster.x-4,monster.y-38);x.closePath();x.fill();x.beginPath();x.moveTo(monster.x+14,monster.y-28);x.lineTo(monster.x+19,monster.y-49);x.lineTo(monster.x+4,monster.y-38);x.closePath();x.fill();if(state==='intro'||state==='win'||state==='lose'){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.fillStyle=state==='lose'?'#ff526a':'#f8eaff';x.font='bold 28px Courier New';x.textAlign='center';let title=state==='intro'?'DREAMLIT':state==='win'?'¡ESCAPARON DEL SUEÑO!':'EL SUEÑO TE DEVORÓ';x.fillText(title,W/2,170);x.font='16px Courier New';if(state==='intro'){x.fillText('Fuiste a vaciar SUPER ILLIT antes de su demolición.',W/2,220);x.fillText('Despertaste en un sueño. YUNAH está encerrada.',W/2,250);x.fillText('Pulsa ENTER para ayudar a todas y encontrar a IROHA.',W/2,310)}}}
function loop(){update();draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Enter')begin();if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);ui.r.onclick=reset;reset();loop();
</script></body></html>
